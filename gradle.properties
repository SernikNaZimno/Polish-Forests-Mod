org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Gradle and Loom for MC 26.3 require Java 25+. The system default Java is 17, so we point
# to the installed JDK 26 permanently. On another machine, change or remove this path.
org.gradle.java.home=C:/Program Files/Java/jdk-26.0.1

# Fabric (https://fabricmc.net/develop)
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT
fabric_api_version=0.161.0+26.3

# Mod
mod_version=0.1.0
maven_group=pl.polishforests
archives_base_name=polishforests

# Dependencies (Modrinth Maven, version ids for Fabric 26.3)
# GeckoLib 5.5.7
geckolib_version=kSxHvs99
# SmartBrainLib 2.0.2
smartbrainlib_version=i5vOn6hO
# Serene Seasons 26.1.2.0.7 (optional)
sereneseasons_version=V9PxJPuw
# GlitchCore 26.3.0.0.3 (required by Serene Seasons)
glitchcore_version=aaUghyGp
