import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		'polishforests' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// In-game client tests (src/gametest): they create a "Poland" world and take screenshots.
	// Server tests are disabled, so no EULA acceptance is needed.
	configureTests {
		createSourceSet = true
		modId = 'polishforests-gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
	implementation "maven.modrinth:smartbrainlib:${project.smartbrainlib_version}"

	// Optional: Serene Seasons. Compiled against its API; the dev environment runs with the mod, unless -PnoSeasons is given
	// (round 1 of the S10 review: the climate game test without SS, docs/03-m2-biomy.md §12.4 point 4).
	compileOnly "maven.modrinth:serene-seasons:${project.sereneseasons_version}"
	if (!project.hasProperty('noSeasons')) {
		localRuntime "maven.modrinth:serene-seasons:${project.sereneseasons_version}"
		localRuntime "maven.modrinth:glitchcore:${project.glitchcore_version}"
	}

	// Step G1: optional tree-felling mods. The compatibility mixins (pl.polishforests.compat.felling, applied only when the
	// mod is loaded) compile against them; the dev environment runs with one of them only with -PtreeFelling=fallingtree or
	// -PtreeFelling=treeharvester (the two would both fell the same tree, so never together).
	compileOnly "maven.modrinth:fallingtree:${project.fallingtree_version}"
	compileOnly "maven.modrinth:tree-harvester:${project.treeharvester_version}"
	def felling = project.findProperty('treeFelling')?.toString()
	if (felling == 'fallingtree') {
		localRuntime "maven.modrinth:fallingtree:${project.fallingtree_version}"
	} else if (felling == 'treeharvester') {
		localRuntime "maven.modrinth:tree-harvester:${project.treeharvester_version}"
		localRuntime "maven.modrinth:collective:${project.collective_version}"
	} else if (felling != null) {
		throw new GradleException("-PtreeFelling=${felling}: use fallingtree or treeharvester")
	}

	// Performance mods from the recommended modpack; in the dev environment only with the -Poptimization flag.
	if (project.hasProperty('optimization')) {
		[
			'sodium:bAZQdGpg',            // Sodium 0.9.2 (stable; required by Nvidium)
			'lithium:WXHRsMRl',           // Lithium 0.26.1
			'ferrite-core:d5ddUdiB',      // FerriteCore 9.0.0
			'c2me-fabric:sSoXjAqP',       // C2ME 0.4.2-alpha.0.88
			'immediatelyfast:3MP9UR23',   // ImmediatelyFast 1.17.1
			'entityculling:F4loCvYt',     // EntityCulling 1.11.2
			'scalablelux:g4eqNSKd',       // ScalableLux 0.3.0-alpha.0.6
			'moreculling:zL2UEFXS',       // MoreCulling 1.9.0-beta.1
			'cloth-config:fg2uyxOW',      // Cloth Config 26.3.159 (required by MoreCulling)
			'badoptimizations:Sp0ctspw',  // BadOptimizations 2.4.1
			'sodium-extra:te2y9qZn',      // Sodium Extra 0.9.4
			'better-block-entities:9VvhfLcA', // Better Block Entities 1.3.9
			'asyncparticles:iDHkUsnf',    // AsyncParticles 26.3.2.0-alpha.3
			'rrls:CAVJGGfj',              // RRLS 5.2.8
			'fastquit:ZZ5dfboC',          // FastQuit 3.1.5
			'forcecloseworldloadingscreen:6XQXbIMc', // Force Close Loading Screen 2.3.7
			'nvidium:8mVK1zbk',           // Nvidium 0.4.4-beta7 (NVIDIA GPUs only)
			'modernfix-mvus:pa9cAfYg',    // ModernFix (MVUS) 5.27.20
			'debugify:FMaS2nZn',          // Debugify 26.3.0.0
			'packet-fixer:dTKbGYbb',      // Packet Fixer 3.3.6
			'chunky:4Eotm6ov',            // Chunky 1.5.3
			'ksyxis:9CU8nnVG',            // Ksyxis 1.4.5
			'structure-layout-optimizer:crWm7jXS', // Structure Layout Optimizer 1.1.4
			'resourceful-config:IFB0XCI9', // Resourceful Config 6.0.1 (required by SLO)
			'zfastnoise:BWKn67tN',        // zFastNoise 1.1.0
			'zconfig:tsgt79sG',           // zConfig 1.0.0 (required by zFastNoise)
			'alternate-current:nSBWPz6x', // Alternate Current 1.9.0
			'asynclogger:Ert0LmWj',       // AsyncLogger 2.2.2
			'clumps:J4I1wxJZ',            // Clumps 26.3.2
		// -PnoNvidium leaves Nvidium out (V3 review round 1): plain Sodium as on AMD and Intel GPUs, where Nvidium does not
		// run; on an NVIDIA GPU with mesh shaders Nvidium switches itself on and draws the terrain instead of Sodium.
		].findAll { !(project.hasProperty('noNvidium') && it.startsWith('nvidium:')) }.each { localRuntime "maven.modrinth:${it}" }
	}

	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	// Step T7: the plain-Java helpers of the client game tests (ViewCone, FrameDiff) have unit tests; classes only, without
	// the resources (fabric.mod.json) of the game-test mod.
	testImplementation files(sourceSets.gametest.output.classesDirs)
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
	// src/main/generated is a resource directory; its datagen cache must not go into the mod jar.
	exclude '.cache/**'
}

// The licenses go into the mod jar: MIT for the code, CC BY 4.0 for the assets (the license asks for the notice to
// travel with the assets) and the credits of the outside sources (step V1, decision D5).
def licenseSuffix = "_${project.archives_base_name}"
tasks.named('jar', Jar) {
	['LICENSE', 'LICENSE-assets', 'CREDITS.md'].each { name ->
		from(name) {
			rename { it.endsWith('.md') ? it.replace('.md', "${licenseSuffix}.md") : "${it}${licenseSuffix}" }
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Landscape model preview rendered to PNG, without launching the game.
tasks.register('landscapePreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders the landscape model to build/preview/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.landscape.LandscapePreview'
	args = [layout.buildDirectory.dir('preview').get().asFile.absolutePath]
	// -PhabitatsOnly: only the M2 habitat preview (frames, O and P maps, valley cross-sections, share CSVs).
	if (project.hasProperty('habitatsOnly')) {
		args += ['20260927', 'habitats']
	}
	jvmArgs = ['-Xmx3G', '-Djava.awt.headless=true']
}

// Crown territory preview (step V5 of the vertical slice) rendered to docs/wycinek/korony/*.png, without the game.
tasks.register('crownPreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders the crown territories of a test stand to docs/wycinek/korony/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.tree.CrownTerritoryPreview'
	args = [file('docs/wycinek/korony').absolutePath]
	jvmArgs = ['-Djava.awt.headless=true']
}

// Tree planner preview (step V6 of the vertical slice) rendered to docs/wycinek/drzewa/*.png, without the game:
// species by age class and layer from the side and from above, shape variants and stands of 3 x 3 chunks.
// -PconifersOnly renders the conifer sheets and the pine stand only.
tasks.register('treePreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders the tree planner sheets and stands to docs/wycinek/drzewa/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.tree.TreePreview'
	args = [file('docs/wycinek/drzewa').absolutePath]
	if (project.hasProperty('conifersOnly')) {
		args += ['conifers']
	}
	jvmArgs = ['-Djava.awt.headless=true']
}

// Cross-sections and top views of the roots of the planner trees (step I1) to docs/wycinek/korzenie/*.png, without the
// game (treePreview writes them too).
tasks.register('rootPreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders the root planner sheets to docs/wycinek/korzenie/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.tree.RootPreview'
	args = [file('docs/wycinek/korzenie').absolutePath]
	jvmArgs = ['-Djava.awt.headless=true']
}

// Views of simulated stands of the slice (review of V9, round 2) rendered to build/stand-preview/*.png, without the game:
// ray-cast eye and above-canopy views with the bare wood of the crowns. -PstandOnly=<part of a stand name> renders one.
tasks.register('standPreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders views of simulated slice stands to build/stand-preview/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.feature.plan.SliceStandPreview'
	args = [layout.buildDirectory.dir('stand-preview').get().asFile.absolutePath, project.findProperty('standOnly') ?: '']
	if (project.hasProperty('standFocus')) {
		args += [project.property('standFocus')]
	}
	jvmArgs = ['-Djava.awt.headless=true']
}

// Unit tests (docs/BRIEF.md, "Komendy"). Test classes are tagged with JUnit 5 tags:
//   @Tag("slow") - classes that take more than ~20 s (large terrain areas, golden test, continuity sweeps);
//   @Tag("cost") - SampleCostTest, CrownTerritoryCostTest (wall-clock measurements without assertions) and
//                  TreeShapePlanCostTest (the planner budgets of step V6, checked);
// Tasks:
//   test     - everything except "cost", in 3 parallel forks (part of 'check' and 'build');
//   fastTest - everything except "slow" and "cost", in 3 parallel forks (quick check during a step, about 1 min);
//   costTest - only "cost", in a single fork and never alongside the other test tasks (mustRunAfter), so that
//              other JVMs do not disturb the timing.
// Parallel forks: each fork is a separate JVM with its own 3 GB heap (3 x 3 GB + Gradle fits in 32 GB). Test classes
// are assigned to forks up front, round-robin in class-file order (not by load), so a test class longer than ~2-3 min
// should be split (WaterContainmentTest and MountainStreamSourcesTest came out of RiverNetworkTest). The tests do not
// share any files (only GoldenTerrainTest writes, and only with -PwriteGolden / -PgoldenReport), so forks cannot
// conflict. Many tests use parallel streams, so the forks also compete for the cores of the common ForkJoinPool; the gain
// comes mostly from overlapping the single-threaded parts.
// -PtestForks=<n> overrides the number of forks of 'test' and 'fastTest' (e.g. 1 to run serially when debugging).
def testForks = (project.findProperty('testForks') ?: '3') as int
tasks.withType(Test).configureEach {
	maxHeapSize = '3G'
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
	// Golden terrain test (GoldenTerrainTest, docs/m2/poprawka-geometrii.md); the flags work for every test task:
	// -PwriteGolden writes a new reference file instead of comparing (only the M2 file; golden_terrain_m1.txt stays),
	//   to -PgoldenFile=<file> or by default to src/test/resources/golden_terrain_m2.txt;
	// -PgoldenKeepCenters (with -PwriteGolden) keeps the patch centers of the current file and searches anew only
	//   for patches that lost their target and for new sites;
	// -PgoldenAllow=<file> lists allowed changes ('<set> / <patch>' lines, e.g. a -PgoldenReport file);
	// -PgoldenReport=<file> writes the changed patches and fields to a file.
	if (project.hasProperty('writeGolden')) {
		systemProperty 'polishforests.golden.write', 'true'
		systemProperty 'polishforests.golden.file', project.hasProperty('goldenFile')
				? file(project.property('goldenFile')).absolutePath
				: file('src/test/resources/golden_terrain_m2.txt').absolutePath
		outputs.upToDateWhen { false }
	}
	if (project.hasProperty('goldenKeepCenters')) {
		systemProperty 'polishforests.golden.keepCenters', 'true'
	}
	// Without -PgoldenAllow the allow list of the latest step (the last src/test/golden-allow/K*.txt by name) is used, so
	// that a plain './gradlew test' passes between the steps of a multi-step terrain change (the geometry fix used it in
	// K3-K6 and K8a-K8c). Steps K7 and K8z regenerated the golden file and removed the directory, so without it a plain
	// 'test' compares with no allow list.
	// -PgoldenStrict compares without any allow list even when the directory exists.
	def goldenAllowPath = project.findProperty('goldenAllow')
	if (goldenAllowPath == null && !project.hasProperty('goldenStrict')) {
		def allowDir = file('src/test/golden-allow')
		def lists = allowDir.isDirectory()
				? (allowDir.listFiles({ f -> f.name ==~ /K.*\.txt/ } as FileFilter) as List).sort { it.name }
				: []
		if (!lists.isEmpty()) {
			goldenAllowPath = lists.last().path
		}
	}
	if (goldenAllowPath != null) {
		def allowFile = file(goldenAllowPath)
		systemProperty 'polishforests.golden.allow', allowFile.absolutePath
		inputs.file(allowFile)
	}
	if (project.hasProperty('goldenReport')) {
		systemProperty 'polishforests.golden.report', file(project.property('goldenReport')).absolutePath
		outputs.upToDateWhen { false }
	}
	// Fixed places of the vertical slice (step V0, SliceSitesTest): -PfindSliceSites searches them again and writes
	// src/test/resources/slice_sites.txt (only with --tests '*SliceSitesTest*'; the usual run checks the table).
	if (project.hasProperty('findSliceSites')) {
		systemProperty 'polishforests.slice.find', 'true'
		systemProperty 'polishforests.slice.file', file('src/test/resources/slice_sites.txt').absolutePath
		outputs.upToDateWhen { false }
	}
	// Sample plots of the norms card by stand (step V9, SlicePlotsTest): -PfindSlicePlots searches them again and writes
	// src/test/resources/slice_plots.txt (only with --tests '*SlicePlotsTest*'; the usual run checks the table).
	if (project.hasProperty('findSlicePlots')) {
		systemProperty 'polishforests.slice.plots.find', 'true'
		systemProperty 'polishforests.slice.plots.file', file('src/test/resources/slice_plots.txt').absolutePath
		outputs.upToDateWhen { false }
	}
	// -PcalibrateSlice: StandCensusSimulationTest prints the norms of simulated stands of the slice (step V9; a report).
	if (project.hasProperty('calibrateSlice')) {
		systemProperty 'polishforests.slice.calibrate', 'true'
		systemProperty 'polishforests.slice.calibrate.only', project.findProperty('calibrateOnly') ?: ''
		outputs.upToDateWhen { false }
	}
	// -PsliceReport: SliceSitesTest prints the biome and association shares of every place (for docs/04).
	if (project.hasProperty('sliceReport')) {
		systemProperty 'polishforests.slice.report', 'true'
		outputs.upToDateWhen { false }
	}
	// Registry snapshot (step V2, RegistrySnapshotTest): -PwriteRegistrySnapshot writes the blocks, properties and items of
	// the mod to src/test/resources/registry_snapshot.txt instead of comparing (only on purpose: saved worlds depend on them).
	if (project.hasProperty('writeRegistrySnapshot')) {
		systemProperty 'polishforests.registry.write', file('src/test/resources/registry_snapshot.txt').absolutePath
		outputs.upToDateWhen { false }
	}
	// Cost tests (SampleCostTest, CrownTerritoryCostTest, TreeShapePlanCostTest): number of runs (default 7), e.g. -PcostRuns=15 when settling the budget.
	if (project.hasProperty('costRuns')) {
		systemProperty 'polishforests.cost.runs', project.property('costRuns')
	}
}

tasks.named('test', Test) {
	description = 'Runs all unit tests except the cost measurement (tag "cost"), in parallel forks.'
	useJUnitPlatform {
		excludeTags 'cost'
	}
	maxParallelForks = testForks
}

tasks.register('fastTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	description = 'Runs the fast unit tests (without the tags "slow" and "cost"), in parallel forks.'
	useJUnitPlatform {
		excludeTags 'slow', 'cost'
	}
	maxParallelForks = testForks
}

tasks.register('costTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	description = 'Runs the cost measurements (tag "cost") alone in a single fork, after any other test task.'
	useJUnitPlatform {
		includeTags 'cost'
	}
	maxParallelForks = 1
	// A timing report: always rerun, never alongside other test JVMs of the same build.
	outputs.upToDateWhen { false }
	mustRunAfter tasks.named('test'), tasks.named('fastTest')
}

// Datagen output check (step S5, docs/03-m2-biomy.md section 11): the output of runDatagen is kept in src/main/generated in
// the repository; './gradlew checkDatagen' hashes the directory, runs runDatagen and fails when any file was added, removed
// or changed (the datagen cache in .cache is ignored). Independent of git, so it also works on uncommitted changes.
abstract class DatagenSnapshot extends DefaultTask {
	@Internal
	abstract DirectoryProperty getGenerated()

	@Internal
	abstract RegularFileProperty getSnapshot()

	static Map<String, String> hashes(File root) {
		def out = new TreeMap<String, String>()
		if (!root.isDirectory()) {
			return out
		}
		root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
			if (!rel.startsWith('.cache/')) {
				out[rel] = MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
			}
		}
		return out
	}

	@TaskAction
	void write() {
		def file = snapshot.get().asFile
		file.parentFile.mkdirs()
		file.text = hashes(generated.get().asFile).collect { k, v -> "${k} ${v}" }.join('\n')
	}
}

abstract class CheckDatagen extends DefaultTask {
	@Internal
	abstract DirectoryProperty getGenerated()

	@Internal
	abstract RegularFileProperty getSnapshot()

	@TaskAction
	void check() {
		def before = new TreeMap<String, String>()
		snapshot.get().asFile.readLines().findAll { !it.isBlank() }.each { line ->
			def i = line.lastIndexOf(' ')
			before[line.substring(0, i)] = line.substring(i + 1)
		}
		def after = DatagenSnapshot.hashes(generated.get().asFile)
		def changed = ((before.keySet() + after.keySet()) as TreeSet).findAll { before[it] != after[it] }
		if (!changed.isEmpty()) {
			throw new GradleException("runDatagen changed ${changed.size()} files in src/main/generated: ${changed.take(20)}")
		}
		logger.lifecycle("checkDatagen: runDatagen left all ${after.size()} files in src/main/generated unchanged")
	}
}

def datagenSnapshotFile = layout.buildDirectory.file('datagen-before.txt')
tasks.register('datagenSnapshot', DatagenSnapshot) {
	generated = layout.projectDirectory.dir('src/main/generated')
	snapshot = datagenSnapshotFile
	outputs.upToDateWhen { false }
}
tasks.named('runDatagen') {
	mustRunAfter 'datagenSnapshot'
}
tasks.register('checkDatagen', CheckDatagen) {
	group = 'verification'
	description = 'Runs runDatagen and fails when it changes the files in src/main/generated.'
	dependsOn 'datagenSnapshot', 'runDatagen'
	generated = layout.projectDirectory.dir('src/main/generated')
	snapshot = datagenSnapshotFile
	outputs.upToDateWhen { false }
}

// Textures from tools/art (step V1, rule ZW-9 of docs/04-pionowy-wycinek.md). The committed PNGs in
// src/main/resources/assets/polishforests/textures must be exactly what the recipes make (decoded RGBA pixels and
// .mcmeta, not PNG bytes), pass the style lint, and CREDITS.md must be up to date:
//   ./gradlew checkArt      checks all that (tools/art/check.py), changes nothing;
//   ./gradlew generateArt   rewrites the textures and CREDITS.md (tools/art/generate.py).
// Neither is part of 'build' or 'check': both need Python 3.10+ with Pillow and NumPy (risk R24). The interpreter is
// found by trying python3, python and 'py -3'; -Ppython=<path> names one. Without a usable one the task fails with a
// message that says what to install.
abstract class ArtTask extends DefaultTask {
	@Inject
	abstract ExecOperations getExecOperations()

	@Internal
	abstract DirectoryProperty getRoot()

	@Input
	@Optional
	abstract Property<String> getPython()

	@Input
	abstract Property<String> getScript()

	@TaskAction
	void run() {
		def dir = root.get().asFile
		def candidates = python.isPresent() ? [[python.get()]] : [['python3'], ['python'], ['py', '-3']]
		def probe = 'import sys, PIL, numpy; sys.exit(0 if sys.version_info >= (3, 10) else 3)'
		def tried = []
		List<String> chosen = null
		for (c in candidates) {
			def out = new ByteArrayOutputStream()
			try {
				def r = execOperations.exec { spec ->
					spec.commandLine(c + ['-c', probe])
					spec.workingDir = dir
					spec.standardOutput = out
					spec.errorOutput = out
					spec.ignoreExitValue = true
				}
				if (r.exitValue == 0) {
					chosen = c
					break
				}
				def last = out.toString().readLines().findAll { !it.isBlank() }
				def why = r.exitValue == 3 ? 'older than 3.10' : (last ? last.last().trim() : "exit ${r.exitValue}")
				tried << "${c.join(' ')} (${why})"
			} catch (Exception ignored) {
				tried << "${c.join(' ')} (not found)"
			}
		}
		if (chosen == null) {
			throw new GradleException("${name} needs Python 3.10 or newer with Pillow and NumPy (pip install pillow numpy). " +
					"Tried: ${tried.join('; ')}. Name an interpreter with -Ppython=<path>. ${name} is not part of 'build'.")
		}
		def result = execOperations.exec { spec ->
			spec.commandLine(chosen + [new File(dir, script.get()).path])
			spec.workingDir = dir
			spec.environment('PYTHONIOENCODING', 'utf-8')
			spec.ignoreExitValue = true
		}
		if (result.exitValue != 0) {
			throw new GradleException("${name} failed, see the messages above (${script.get()} exited with ${result.exitValue})")
		}
	}
}

tasks.register('checkArt', ArtTask) {
	group = 'verification'
	description = 'Checks that the committed textures and CREDITS.md are exactly what tools/art makes and pass the style lint.'
	root = layout.projectDirectory
	script = 'tools/art/check.py'
	if (project.hasProperty('python')) {
		python = project.property('python').toString()
	}
	outputs.upToDateWhen { false }
}

tasks.register('generateArt', ArtTask) {
	group = 'polishforests'
	description = 'Regenerates the textures in src/main/resources/assets/polishforests/textures and CREDITS.md with tools/art.'
	root = layout.projectDirectory
	script = 'tools/art/generate.py'
	if (project.hasProperty('python')) {
		python = project.property('python').toString()
	}
	outputs.upToDateWhen { false }
}

// Choosing in-game tests: ./gradlew runClientGameTest -Pgametest=performance|stages|views|climate|ui|habitats|vegetation|present_day|determinism|ecotones|slice|probes|cover|all
// (cover: only by name; step K1, the thin and the realistic loose cover in pits down to Y 0 in a sandy lowland, a till
// lowland and a valley floor, with a survey of cover, ores, voids and side faces; -Pscales=realistic|gameplay)
// (probes: only by name; the render trials of step V3 with probe blocks that exist only in this run, -Psites=board|rebuild
// picks a part; combine with -Poptimization (with -PnoNvidium: plain Sodium) and -PnoSeasons; results in
// build/probes/<vanilla|sodium|sodium_nvidium>_<ss|noss>.txt)
// (ecotones: only by name, not in all; screenshots of biome borders, step S8b)
// (slice -Psites=felling: step G1, felling trees with a tree-felling mod; needs -PtreeFelling=fallingtree|treeharvester,
// results in build/felling/<mod>.txt)
// (slice: only by name; the fixed places of the vertical slice from src/test/resources/slice_sites.txt, step V0;
// -Pmodes=natural|present_day picks a vegetation mode, -Psites=<place names>|none; the cameras come from
// src/test/resources/slice_cameras.txt, -PfindSliceCameras chooses them anew and writes the file; -Pgametest=stages
// -Psites=slice measures the stages in the places of the slice instead of the M2 areas; -Psites=samples builds the sample
// board of the thin trunks (step V2), -Psites=trees the board of the tree planner (step V6), -Psites=leaves the board of
// the species leaves, saplings and the LITE pine set in the seasons (step V7, results in build/leaves/))
// Only selected views: -Psites=beach,cliff (names from PolandWorldClientGameTest; for vegetation the soil places of
// HabitatsClientGameTest, or none for no screenshots).
// -PdebugHabitats: diagnostic mode, zones and biomes painted on the top block (docs/03-m2-biomy.md §7.5).
// -Pscales=realistic or -Pscales=gameplay: HabitatsClientGameTest, VegetationClientGameTest and PresentDayClientGameTest in one scale only.
tasks.named('runClientGameTest') {
	// Step Z1: the recommended Serene Seasons configuration of the modpack (a new world starts in late spring, 12 days per
	// sub-season) in the run directory, so the tests see the same start as the players of the pack.
	def seasonsConfig = file('tools/modpack/config/sereneseasons/seasons.toml')
	def seasonsTarget = layout.buildDirectory.file('run/clientGameTest/config/sereneseasons/seasons.toml').get().asFile
	def withSeasons = !project.hasProperty('noSeasons')
	// Step G1: with -PtreeFelling=fallingtree the recommended FallingTree configuration of the modpack (tree size limits,
	// drops at the cut, axe damage), so the felling test (-Pgametest=slice -Psites=felling) sees what the players of the pack do.
	def fellingConfig = file('tools/modpack/config/fallingtree.json')
	def fellingTarget = layout.buildDirectory.file('run/clientGameTest/config/fallingtree.json').get().asFile
	def withFallingTree = project.findProperty('treeFelling')?.toString() == 'fallingtree'
	doFirst {
		if (withSeasons) {
			seasonsTarget.parentFile.mkdirs()
			java.nio.file.Files.copy(seasonsConfig.toPath(), seasonsTarget.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
		if (withFallingTree) {
			fellingTarget.parentFile.mkdirs()
			java.nio.file.Files.copy(fellingConfig.toPath(), fellingTarget.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
		}
	}
	jvmArgs "-Dpolishforests.gametest=${project.findProperty('gametest') ?: 'all'}"
	jvmArgs "-Dpolishforests.sites=${project.findProperty('sites') ?: ''}"
	jvmArgs "-Dpolishforests.scales=${project.findProperty('scales') ?: ''}"
	jvmArgs "-Dpolishforests.modes=${project.findProperty('modes') ?: ''}"
	jvmArgs "-Dpolishforests.slice.sites=${file('src/test/resources/slice_sites.txt').absolutePath}"
	// Sample plots of the norms card by stand (step V9).
	jvmArgs "-Dpolishforests.slice.plots=${file('src/test/resources/slice_plots.txt').absolutePath}"
	// Registry snapshot (step V2): the trunk samples (-Pgametest=slice -Psites=samples) compare the game's registry with it.
	jvmArgs "-Dpolishforests.registry.snapshot=${file('src/test/resources/registry_snapshot.txt').absolutePath}"
	// Fixed cameras of the slice (V0 review round 1); -PfindSliceCameras chooses them anew and writes the file.
	jvmArgs "-Dpolishforests.slice.cameras=${file('src/test/resources/slice_cameras.txt').absolutePath}"
	if (project.hasProperty('findSliceCameras')) {
		jvmArgs '-Dpolishforests.slice.findCameras=true'
	}
	// Diagnostic mode of step S6: the top block painted with the color of the zone or biome (-PdebugHabitats).
	if (project.hasProperty('debugHabitats')) {
		jvmArgs '-Dpolishforests.debug.habitats=true'
	}
	// Time limits of HabitatsClientGameTest only reported (-PtimingsReportOnly), for runs on a machine that is not quiet.
	if (project.hasProperty('timingsReportOnly')) {
		jvmArgs '-Dpolishforests.timings.reportOnly=true'
	}
	// Determinism test (step S10, -Pgametest=determinism): column hashes go to build/determinism/<plain|optimization>.txt;
	// -PdeterminismReference=<file> compares the run with a file of a run with the other mod set (with or without -Poptimization).
	jvmArgs "-Dpolishforests.determinism.out=${layout.buildDirectory.dir('determinism').get().asFile.absolutePath}"
	if (project.hasProperty('determinismReference')) {
		jvmArgs "-Dpolishforests.determinism.reference=${file(project.property('determinismReference')).absolutePath}"
	}
	// Norms card of step V4 (-Pgametest=slice): the census of the plots and transects, build/norms/karta-norm.csv.
	jvmArgs "-Dpolishforests.norms.out=${layout.buildDirectory.dir('norms').get().asFile.absolutePath}"
	// Render trials of step V3 (-Pgametest=probes): the measured colors, shares and frame times of each run.
	jvmArgs "-Dpolishforests.probes.out=${layout.buildDirectory.dir('probes').get().asFile.absolutePath}"
	// Leaves board of step V7 (-Pgametest=slice -Psites=leaves): build/leaves/<renderer>_<ss|noss>.txt.
	// Step V10: -PskipSeasonWave skips the own mesh wave when Serene Seasons changes the sub-season (a measurement switch).
	if (project.hasProperty('skipSeasonWave')) {
		jvmArgs '-Dpolishforests.skipSeasonWave=true'
	}
	// Step O1: -Pgametest=performance -Psites=slice -PloadOnly measures only the load of new terrain (no camera flight).
	if (project.hasProperty('loadOnly')) {
		jvmArgs '-Dpolishforests.loadOnly=true'
	}
	// Review round 1 of V13: -PperfSeason=<sub-season> sets the date of the flights of -Pgametest=performance -Psites=slice.
	if (project.hasProperty('perfSeason')) {
		jvmArgs "-Dpolishforests.perfSeason=${project.property('perfSeason')}"
	}
	jvmArgs "-Dpolishforests.leaves.out=${layout.buildDirectory.dir('leaves').get().asFile.absolutePath}"
	// Step G1: the results of -Pgametest=slice -Psites=felling (with -PtreeFelling=fallingtree|treeharvester).
	jvmArgs "-Dpolishforests.felling.out=${layout.buildDirectory.dir('felling').get().asFile.absolutePath}"
	// Step V13: the results of -Pgametest=slice -Psites=seasons.
	jvmArgs "-Dpolishforests.seasons.out=${layout.buildDirectory.dir('seasons').get().asFile.absolutePath}"
	// Step T7: screenshots wait until the view is drawn (gametest ViewReady). -PviewWait=fixed restores the fixed waits of
	// before T7 (for a timing comparison); -PviewCheck takes a reference frame <name>_ref 60 s (-PviewCheckSeconds) after
	// each teleport and compares it with the frame (build/view-check/report.txt and diff images; clouds off in the run),
	// -PviewCheckOnly=<regex> limits the check to some frames; -PviewReach=<blocks> overrides the reach of the view cone.
	if (project.hasProperty('viewWait')) {
		jvmArgs "-Dpolishforests.view.wait=${project.property('viewWait')}"
	}
	if (project.hasProperty('viewCheck')) {
		jvmArgs '-Dpolishforests.view.check=true'
	}
	if (project.hasProperty('viewCheckSeconds')) {
		jvmArgs "-Dpolishforests.view.checkSeconds=${project.property('viewCheckSeconds')}"
	}
	if (project.hasProperty('viewCheckOnly')) {
		jvmArgs "-Dpolishforests.view.checkOnly=${project.property('viewCheckOnly')}"
	}
	if (project.hasProperty('viewReach')) {
		jvmArgs "-Dpolishforests.view.reach=${project.property('viewReach')}"
	}
	jvmArgs "-Dpolishforests.view.out=${layout.buildDirectory.dir('view-check').get().asFile.absolutePath}"
	if (project.hasProperty('profile')) {
		jvmArgs "-XX:StartFlightRecording=filename=${layout.buildDirectory.file('profile.jfr').get().asFile.absolutePath},settings=profile"
	}
}
