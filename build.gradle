import java.security.MessageDigest

plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		'polishforests' {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
	// In-game client tests (src/gametest): they create a "Poland" world and take screenshots.
	// Server tests are disabled, so no EULA acceptance is needed.
	configureTests {
		createSourceSet = true
		modId = 'polishforests-gametest'
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Required
	implementation "maven.modrinth:geckolib:${project.geckolib_version}"
	implementation "maven.modrinth:smartbrainlib:${project.smartbrainlib_version}"

	// Optional: Serene Seasons. Compiled against its API; the dev environment runs with the mod.
	compileOnly "maven.modrinth:serene-seasons:${project.sereneseasons_version}"
	localRuntime "maven.modrinth:serene-seasons:${project.sereneseasons_version}"
	localRuntime "maven.modrinth:glitchcore:${project.glitchcore_version}"

	// Performance mods from the recommended modpack; in the dev environment only with the -Poptimization flag.
	if (project.hasProperty('optimization')) {
		[
			'sodium:bAZQdGpg',            // Sodium 0.9.2 (stable; required by Nvidium)
			'lithium:WXHRsMRl',           // Lithium 0.26.1
			'ferrite-core:d5ddUdiB',      // FerriteCore 9.0.0
			'c2me-fabric:sSoXjAqP',       // C2ME 0.4.2-alpha.0.88
			'immediatelyfast:3MP9UR23',   // ImmediatelyFast 1.17.1
			'entityculling:F4loCvYt',     // EntityCulling 1.11.2
			'scalablelux:g4eqNSKd',       // ScalableLux 0.3.0-alpha.0.6
			'moreculling:zL2UEFXS',       // MoreCulling 1.9.0-beta.1
			'cloth-config:fg2uyxOW',      // Cloth Config 26.3.159 (required by MoreCulling)
			'badoptimizations:Sp0ctspw',  // BadOptimizations 2.4.1
			'sodium-extra:te2y9qZn',      // Sodium Extra 0.9.4
			'better-block-entities:9VvhfLcA', // Better Block Entities 1.3.9
			'asyncparticles:iDHkUsnf',    // AsyncParticles 26.3.2.0-alpha.3
			'rrls:CAVJGGfj',              // RRLS 5.2.8
			'fastquit:ZZ5dfboC',          // FastQuit 3.1.5
			'forcecloseworldloadingscreen:6XQXbIMc', // Force Close Loading Screen 2.3.7
			'nvidium:8mVK1zbk',           // Nvidium 0.4.4-beta7 (NVIDIA GPUs only)
			'modernfix-mvus:pa9cAfYg',    // ModernFix (MVUS) 5.27.20
			'debugify:FMaS2nZn',          // Debugify 26.3.0.0
			'packet-fixer:dTKbGYbb',      // Packet Fixer 3.3.6
			'chunky:4Eotm6ov',            // Chunky 1.5.3
			'ksyxis:9CU8nnVG',            // Ksyxis 1.4.5
			'structure-layout-optimizer:crWm7jXS', // Structure Layout Optimizer 1.1.4
			'resourceful-config:IFB0XCI9', // Resourceful Config 6.0.1 (required by SLO)
			'zfastnoise:BWKn67tN',        // zFastNoise 1.1.0
			'zconfig:tsgt79sG',           // zConfig 1.0.0 (required by zFastNoise)
			'alternate-current:nSBWPz6x', // Alternate Current 1.9.0
			'asynclogger:Ert0LmWj',       // AsyncLogger 2.2.2
			'clumps:J4I1wxJZ',            // Clumps 26.3.2
		].each { localRuntime "maven.modrinth:${it}" }
	}

	testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property 'version', version

	filesMatching('fabric.mod.json') {
		expand 'version': version
	}
	// src/main/generated is a resource directory; its datagen cache must not go into the mod jar.
	exclude '.cache/**'
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Landscape model preview rendered to PNG, without launching the game.
tasks.register('landscapePreview', JavaExec) {
	group = 'polishforests'
	description = 'Renders the landscape model to build/preview/*.png'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'pl.polishforests.worldgen.landscape.LandscapePreview'
	args = [layout.buildDirectory.dir('preview').get().asFile.absolutePath]
	// -PhabitatsOnly: only the M2 habitat preview (frames, O and P maps, valley cross-sections, share CSVs).
	if (project.hasProperty('habitatsOnly')) {
		args += ['20260927', 'habitats']
	}
	jvmArgs = ['-Xmx3G', '-Djava.awt.headless=true']
}

// Unit tests (docs/BRIEF.md, "Komendy"). Test classes are tagged with JUnit 5 tags:
//   @Tag("slow") - classes that take more than ~20 s (large terrain areas, golden test, continuity sweeps);
//   @Tag("cost") - SampleCostTest, a wall-clock measurement without assertions.
// Tasks:
//   test     - everything except "cost", in 3 parallel forks (part of 'check' and 'build');
//   fastTest - everything except "slow" and "cost", in 3 parallel forks (quick check during a step, about 1 min);
//   costTest - only "cost", in a single fork and never alongside the other test tasks (mustRunAfter), so that
//              other JVMs do not disturb the timing.
// Parallel forks: each fork is a separate JVM with its own 3 GB heap (3 x 3 GB + Gradle fits in 32 GB). Test classes
// are assigned to forks up front, round-robin in class-file order (not by load), so a test class longer than ~2-3 min
// should be split (WaterContainmentTest and MountainStreamSourcesTest came out of RiverNetworkTest). The tests do not
// share any files (only GoldenTerrainTest writes, and only with -PwriteGolden / -PgoldenReport), so forks cannot
// conflict. Many tests use parallel streams, so the forks also compete for the cores of the common ForkJoinPool; the gain
// comes mostly from overlapping the single-threaded parts.
// -PtestForks=<n> overrides the number of forks of 'test' and 'fastTest' (e.g. 1 to run serially when debugging).
def testForks = (project.findProperty('testForks') ?: '3') as int
tasks.withType(Test).configureEach {
	maxHeapSize = '3G'
	testLogging {
		showStandardStreams = true
		exceptionFormat = 'full'
	}
	// Golden terrain test (GoldenTerrainTest, docs/m2/poprawka-geometrii.md); the flags work for every test task:
	// -PwriteGolden writes a new reference file instead of comparing (only the M2 file; golden_terrain_m1.txt stays),
	//   to -PgoldenFile=<file> or by default to src/test/resources/golden_terrain_m2.txt;
	// -PgoldenKeepCenters (with -PwriteGolden) keeps the patch centers of the current file and searches anew only
	//   for patches that lost their target and for new sites;
	// -PgoldenAllow=<file> lists allowed changes ('<set> / <patch>' lines, e.g. a -PgoldenReport file);
	// -PgoldenReport=<file> writes the changed patches and fields to a file.
	if (project.hasProperty('writeGolden')) {
		systemProperty 'polishforests.golden.write', 'true'
		systemProperty 'polishforests.golden.file', project.hasProperty('goldenFile')
				? file(project.property('goldenFile')).absolutePath
				: file('src/test/resources/golden_terrain_m2.txt').absolutePath
		outputs.upToDateWhen { false }
	}
	if (project.hasProperty('goldenKeepCenters')) {
		systemProperty 'polishforests.golden.keepCenters', 'true'
	}
	// Without -PgoldenAllow the allow list of the latest step (the last src/test/golden-allow/K*.txt by name) is used, so
	// that a plain './gradlew test' passes between the steps of a multi-step terrain change (the geometry fix used it in
	// K3-K6 and K8a-K8c). Steps K7 and K8z regenerated the golden file and removed the directory, so without it a plain
	// 'test' compares with no allow list.
	// -PgoldenStrict compares without any allow list even when the directory exists.
	def goldenAllowPath = project.findProperty('goldenAllow')
	if (goldenAllowPath == null && !project.hasProperty('goldenStrict')) {
		def allowDir = file('src/test/golden-allow')
		def lists = allowDir.isDirectory()
				? (allowDir.listFiles({ f -> f.name ==~ /K.*\.txt/ } as FileFilter) as List).sort { it.name }
				: []
		if (!lists.isEmpty()) {
			goldenAllowPath = lists.last().path
		}
	}
	if (goldenAllowPath != null) {
		def allowFile = file(goldenAllowPath)
		systemProperty 'polishforests.golden.allow', allowFile.absolutePath
		inputs.file(allowFile)
	}
	if (project.hasProperty('goldenReport')) {
		systemProperty 'polishforests.golden.report', file(project.property('goldenReport')).absolutePath
		outputs.upToDateWhen { false }
	}
	// SampleCostTest: number of runs (default 7), e.g. -PcostRuns=15 when settling the budget.
	if (project.hasProperty('costRuns')) {
		systemProperty 'polishforests.cost.runs', project.property('costRuns')
	}
}

tasks.named('test', Test) {
	description = 'Runs all unit tests except the cost measurement (tag "cost"), in parallel forks.'
	useJUnitPlatform {
		excludeTags 'cost'
	}
	maxParallelForks = testForks
}

tasks.register('fastTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	description = 'Runs the fast unit tests (without the tags "slow" and "cost"), in parallel forks.'
	useJUnitPlatform {
		excludeTags 'slow', 'cost'
	}
	maxParallelForks = testForks
}

tasks.register('costTest', Test) {
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	description = 'Runs SampleCostTest (tag "cost") alone in a single fork, after any other test task.'
	useJUnitPlatform {
		includeTags 'cost'
	}
	maxParallelForks = 1
	// A timing report: always rerun, never alongside other test JVMs of the same build.
	outputs.upToDateWhen { false }
	mustRunAfter tasks.named('test'), tasks.named('fastTest')
}

// Datagen output check (step S5, docs/03-m2-biomy.md section 11): the output of runDatagen is kept in src/main/generated in
// the repository; './gradlew checkDatagen' hashes the directory, runs runDatagen and fails when any file was added, removed
// or changed (the datagen cache in .cache is ignored). Independent of git, so it also works on uncommitted changes.
abstract class DatagenSnapshot extends DefaultTask {
	@Internal
	abstract DirectoryProperty getGenerated()

	@Internal
	abstract RegularFileProperty getSnapshot()

	static Map<String, String> hashes(File root) {
		def out = new TreeMap<String, String>()
		if (!root.isDirectory()) {
			return out
		}
		root.eachFileRecurse(groovy.io.FileType.FILES) { f ->
			def rel = root.toPath().relativize(f.toPath()).toString().replace('\\', '/')
			if (!rel.startsWith('.cache/')) {
				out[rel] = MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
			}
		}
		return out
	}

	@TaskAction
	void write() {
		def file = snapshot.get().asFile
		file.parentFile.mkdirs()
		file.text = hashes(generated.get().asFile).collect { k, v -> "${k} ${v}" }.join('\n')
	}
}

abstract class CheckDatagen extends DefaultTask {
	@Internal
	abstract DirectoryProperty getGenerated()

	@Internal
	abstract RegularFileProperty getSnapshot()

	@TaskAction
	void check() {
		def before = new TreeMap<String, String>()
		snapshot.get().asFile.readLines().findAll { !it.isBlank() }.each { line ->
			def i = line.lastIndexOf(' ')
			before[line.substring(0, i)] = line.substring(i + 1)
		}
		def after = DatagenSnapshot.hashes(generated.get().asFile)
		def changed = ((before.keySet() + after.keySet()) as TreeSet).findAll { before[it] != after[it] }
		if (!changed.isEmpty()) {
			throw new GradleException("runDatagen changed ${changed.size()} files in src/main/generated: ${changed.take(20)}")
		}
		logger.lifecycle("checkDatagen: runDatagen left all ${after.size()} files in src/main/generated unchanged")
	}
}

def datagenSnapshotFile = layout.buildDirectory.file('datagen-before.txt')
tasks.register('datagenSnapshot', DatagenSnapshot) {
	generated = layout.projectDirectory.dir('src/main/generated')
	snapshot = datagenSnapshotFile
	outputs.upToDateWhen { false }
}
tasks.named('runDatagen') {
	mustRunAfter 'datagenSnapshot'
}
tasks.register('checkDatagen', CheckDatagen) {
	group = 'verification'
	description = 'Runs runDatagen and fails when it changes the files in src/main/generated.'
	dependsOn 'datagenSnapshot', 'runDatagen'
	generated = layout.projectDirectory.dir('src/main/generated')
	snapshot = datagenSnapshotFile
	outputs.upToDateWhen { false }
}

// Choosing in-game tests: ./gradlew runClientGameTest -Pgametest=performance|stages|views|climate|ui|habitats|vegetation|all
// Only selected views: -Psites=beach,cliff (names from PolandWorldClientGameTest; for vegetation the soil places of
// HabitatsClientGameTest, or none for no screenshots).
// -PdebugHabitats: diagnostic mode, zones and biomes painted on the top block (docs/03-m2-biomy.md §7.5).
// -Pscales=realistic or -Pscales=gameplay: HabitatsClientGameTest and VegetationClientGameTest in one scale only.
tasks.named('runClientGameTest') {
	jvmArgs "-Dpolishforests.gametest=${project.findProperty('gametest') ?: 'all'}"
	jvmArgs "-Dpolishforests.sites=${project.findProperty('sites') ?: ''}"
	jvmArgs "-Dpolishforests.scales=${project.findProperty('scales') ?: ''}"
	// Diagnostic mode of step S6: the top block painted with the color of the zone or biome (-PdebugHabitats).
	if (project.hasProperty('debugHabitats')) {
		jvmArgs '-Dpolishforests.debug.habitats=true'
	}
	if (project.hasProperty('profile')) {
		jvmArgs "-XX:StartFlightRecording=filename=${layout.buildDirectory.file('profile.jfr').get().asFile.absolutePath},settings=profile"
	}
}
