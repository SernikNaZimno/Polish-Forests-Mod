name: Release

# Publishes a version of the mod to Modrinth and GitHub Releases.
# Run it from the Actions tab ("Release" -> "Run workflow") on a commit that passed the full
# test suite and the client game tests. Needs the repository secret MODRINTH_TOKEN (a Modrinth
# personal access token with the "Create versions" scope) and the repository variable
# MODRINTH_PROJECT_ID (the project ID shown on the Modrinth project page).

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.2.0-alpha.1 (needs a matching "## [version]" section in CHANGELOG.md)
        required: true
      version_type:
        description: Release channel
        type: choice
        options: [alpha, beta, release]
        default: alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Point Gradle to the runner JDK
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.home=$JAVA_HOME" >> ~/.gradle/gradle.properties
          chmod +x gradlew

      - uses: gradle/actions/setup-gradle@v4

      - name: Changelog of this version
        run: |
          awk -v v="${{ inputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section '## [${{ inputs.version }}]'" >&2
            exit 1
          fi

      - name: Fast tests and build
        run: ./gradlew fastTest build -x test -PtestForks=2 -Pmod_version=${{ inputs.version }}

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: v${{ inputs.version }}
          github-prerelease: ${{ inputs.version_type != 'release' }}
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          name: Polish Forests ${{ inputs.version }}
          version: ${{ inputs.version }}
          version-type: ${{ inputs.version_type }}
          changelog-file: release-notes.md
          loaders: fabric
          game-versions: '26.3'
          java: '25'
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
            geckolib(required){modrinth:8BmcQJ2H}
            smartbrainlib(required){modrinth:PuyPazRT}
            serene-seasons(optional){modrinth:e0bNACJD}
